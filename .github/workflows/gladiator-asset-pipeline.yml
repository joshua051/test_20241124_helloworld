name: Gladiator Asset Pipeline

on:
  push:
    branches: [feat/arena-prototype-v0.1.0]
    paths:
      - 'tools/art/**'
      - '.github/workflows/gladiator-asset-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gladiator-art-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Acquire and hash-check permitted author assets
        run: |
          python3 tools/art/inspect_sources.py
          python3 tools/art/build_model_data.py
      - name: Install actual Blender renderer and exporter dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
      - name: Skin, export and render actual model data
        run: blender --background --factory-startup --disable-autoexec --threads 2 --python-exit-code 1 --python tools/art/render_gladiator.py
      - name: Preserve source, model data, standard exports and actual renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gladiator-integrated-assets
          path: |
            ArtInspection/
            ArtExports/
            Assets/Resources/Gladiators/
          if-no-files-found: error
          retention-days: 30
